[project]
name = "simurg-opportunities"
version = "0.1.0"
requires-python = ">=3.8"
dependencies = [
    "aiogram>=3.7",
    "telethon>=1.36",
    "openai>=1.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis[hiredis]>=5.0",
    "apscheduler>=3.10",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "tenacity>=8.3",
    "numpy>=1.24",
    "httpx>=0.27",
    "playwright>=1.44",
    "Pillow>=10.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
# Web-catalog scraping (src/collector/web/, run by webscan.yml).
#
# sirel.org's WAF fingerprints the TLS handshake, not the headers: curl gets
# 200 while httpx and urllib get 403 from the same IP, with the same
# User-Agent, at the same moment (verified directly). curl_cffi presents a
# browser TLS fingerprint and gets 200.
#
# Kept OUT of the base dependencies deliberately: it ships a compiled libcurl,
# and botcheck.yml / vercelcheck.yml both assert that heavy packages do not
# leak into the bot and serverless bundles. Only webscan.yml installs this
# extra; src/collector/web/http.py falls back to httpx when it is absent.
scrape = ["curl_cffi>=0.7"]

[project.scripts]
simurg = "src.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# Vercel's Python runtime resolves ONE top-level app/application/handler per
# deployment. Without this it picks up src/main.py (the always-on entrypoint,
# which exports no handler) and the build fails. api/index.py routes the
# webhook and the setup endpoint internally.
[tool.vercel]
entrypoint = "api.index:handler"
