name: Hackathon Watcher

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
    inputs:
      args:
        description: "Extra CLI args (e.g. '-r mlh hackclub -n -f -l 3' for a debug dry-run). Leave empty for a normal run."
        required: false
        default: ""

concurrency:
  group: hackathon-watcher
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: hackathon-watcher
        run: pip install -r requirements.txt

      - name: Run watcher
        working-directory: hackathon-watcher
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.HACKATHON_WATCHER_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.HACKATHON_WATCHER_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py ${{ inputs.args }}

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- hackathon-watcher/state/seen.json; then
            echo "no state change, skipping commit"
            exit 0
          fi
          git add hackathon-watcher/state/seen.json
          git commit -m "hackathon-watcher: update seen.json [skip ci]"
          git push
