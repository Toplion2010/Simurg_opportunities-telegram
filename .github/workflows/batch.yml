name: Batch process opportunities

on:
  schedule:
    # 5x/day. Cron is UTC; these are 06:00, 10:00, 14:00, 18:00, 22:00 Astana (UTC+5).
    # Off-the-hour minute because GitHub queues scheduled runs at low priority and
    # :00 is the most congested slot — expect runs to start late regardless.
    - cron: "7 1,5,9,13,17 * * *"
  workflow_dispatch: {}

concurrency:
  # Never let a slow run overlap the next scheduled one: two runs would fetch the
  # same channel history twice and double-process it. Shared with drain.yml so a
  # 10-minute drain never runs alongside a batch — concurrent getUpdates calls
  # would 409, and two publishers could double-post the same opportunity.
  group: simurg-runtime
  cancel-in-progress: false

jobs:
  batch:
    runs-on: ubuntu-latest
    # Steady-state runs are minutes, but the very first run for a channel has no
    # cursor and pulls a seed batch, so 40 channels x ~9s/message needs headroom.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Install Chromium for card rendering
        run: playwright install --with-deps chromium

      - name: Run database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_IDS: ${{ secrets.ADMIN_IDS }}
          TELETHON_API_ID: ${{ secrets.TELETHON_API_ID }}
          TELETHON_API_HASH: ${{ secrets.TELETHON_API_HASH }}
          DEST_CHANNEL_ID_SCHOOL: ${{ secrets.DEST_CHANNEL_ID_SCHOOL }}
          DEST_CHANNEL_ID_UNIVERSITY: ${{ secrets.DEST_CHANNEL_ID_UNIVERSITY }}
        run: alembic upgrade head

      - name: Run batch
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_IDS: ${{ secrets.ADMIN_IDS }}
          TELETHON_API_ID: ${{ secrets.TELETHON_API_ID }}
          TELETHON_API_HASH: ${{ secrets.TELETHON_API_HASH }}
          TELETHON_SESSION_STRING: ${{ secrets.TELETHON_SESSION_STRING }}
          DEST_CHANNEL_ID_SCHOOL: ${{ secrets.DEST_CHANNEL_ID_SCHOOL }}
          DEST_CHANNEL_ID_UNIVERSITY: ${{ secrets.DEST_CHANNEL_ID_UNIVERSITY }}
          # Optional third channel for KZ hackathons; see drain.yml. Empty when
          # the secret is unset, which Settings() reads as "off".
          DEST_CHANNEL_ID_HACKATHON: ${{ secrets.DEST_CHANNEL_ID_HACKATHON }}
          # Tried routing extraction through Gemini's OpenAI-compat endpoint
          # (https://generativelanguage.googleapis.com/v1beta/openai/) to
          # dodge Groq's ~100k tokens/day free-tier wall. Every single call
          # 404'd (confirmed across an 8-minute run, not a transient blip) --
          # the key works fine against the native generateContent endpoint
          # (used for vision), just not this compat path. Reverted to Groq;
          # see PLAN_TRIAGE.md verification notes for the run that proved it.
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ENVIRONMENT: production
          LOCAL_DEV: "false"
          # drain.yml owns the Telegram connection and runs every 10 minutes;
          # a second getUpdates consumer here would 409 against it.
          SIMURG_SKIP_DRAIN: "true"
          SIMURG_MEDIA_DIR: ${{ runner.temp }}/simurg_media
        run: python -m src.routines.batch_processor
