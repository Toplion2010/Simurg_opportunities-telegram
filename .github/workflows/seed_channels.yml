name: Seed Telegram source channels

# Manual only — the channel list changes when someone edits
# scripts/seed_channels.py's SOURCE_CHANNELS list, not on a schedule.
# Resolves each username/invite link via Telethon and inserts new rows
# into source_channels; existing channels are skipped, so this is safe
# to re-run after adding just one new entry to the list.
on:
  workflow_dispatch: {}

jobs:
  seed-channels:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "sqlalchemy[asyncio]>=2.0" asyncpg pydantic-settings telethon

      - name: Seed channels
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_IDS: ${{ secrets.ADMIN_IDS }}
          TELETHON_API_ID: ${{ secrets.TELETHON_API_ID }}
          TELETHON_API_HASH: ${{ secrets.TELETHON_API_HASH }}
          TELETHON_SESSION_STRING: ${{ secrets.TELETHON_SESSION_STRING }}
          DEST_CHANNEL_ID_SCHOOL: ${{ secrets.DEST_CHANNEL_ID_SCHOOL }}
          DEST_CHANNEL_ID_UNIVERSITY: ${{ secrets.DEST_CHANNEL_ID_UNIVERSITY }}
        run: python -m scripts.seed_channels
