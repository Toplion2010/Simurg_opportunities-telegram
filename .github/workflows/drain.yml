name: Drain approvals and publish

# Runs just the "apply admin taps + publish what's approved" half of the batch
# job, skipping the slow Telethon fetch and all LLM calls. This is the ONLY
# workflow that talks to getUpdates (batch.yml sets SIMURG_SKIP_DRAIN), so
# approvals land here rather than waiting hours for the 4-hourly collection run.
on:
  schedule:
    # Every 10 minutes. GitHub throttles and delays frequent crons on free
    # runners, so treat this as "roughly every 10-25 minutes", not a guarantee.
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      window_seconds:
        description: "Max seconds to spend draining (it stops early once empty)"
        required: false
        default: "120"

# Shared with batch.yml: only one job may hold the Telegram connection at a
# time, otherwise concurrent getUpdates calls 409 and two publishers could
# double-post the same opportunity.
concurrency:
  group: simurg-runtime
  cancel-in-progress: false

jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Install Chromium for card rendering
        run: playwright install --with-deps chromium

      - name: Drain and publish
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_IDS: ${{ secrets.ADMIN_IDS }}
          TELETHON_API_ID: ${{ secrets.TELETHON_API_ID }}
          TELETHON_API_HASH: ${{ secrets.TELETHON_API_HASH }}
          DEST_CHANNEL_ID_SCHOOL: ${{ secrets.DEST_CHANNEL_ID_SCHOOL }}
          DEST_CHANNEL_ID_UNIVERSITY: ${{ secrets.DEST_CHANNEL_ID_UNIVERSITY }}
          # Optional third channel: KZ hackathons publish here as well as to
          # the audience channels above. Unset expands to "" and Settings()
          # coerces that back to 0 (feature off), so this line is safe to merge
          # before the secret exists.
          DEST_CHANNEL_ID_HACKATHON: ${{ secrets.DEST_CHANNEL_ID_HACKATHON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ENVIRONMENT: production
          LOCAL_DEV: "false"
          # Empty on a scheduled run (no inputs), which falls back to the
          # module default — the drain exits as soon as the queue is empty
          # regardless, so this is only ever an upper bound.
          SIMURG_APPROVAL_WINDOW_SECONDS: ${{ inputs.window_seconds }}
          SIMURG_MEDIA_DIR: ${{ runner.temp }}/simurg_media
        run: python -m scripts.drain_and_publish
