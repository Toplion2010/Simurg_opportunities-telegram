name: AI re-score pending opportunities

# Manual only — never scheduled. Calls Groq (already used for Telegram field
# extraction) to judge every pending opportunity against the same 3-axis
# rubric src/core/scoring.py computes with regex, as a second opinion.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Write the AI's scores to the database (unchecked = dry run, just prints)."
        required: false
        default: false
        type: boolean
      limit:
        description: "Only score this many pending rows (blank = all)."
        required: false
        default: ""
      count_only:
        description: "Just print how many rows still need scoring, no LLM calls (overrides apply/limit)."
        required: false
        default: false
        type: boolean

jobs:
  ai-rescore:
    runs-on: ubuntu-latest
    # Sequential, paced calls (one request every ~2s to stay under Groq's
    # free-tier per-minute cap). Groq also caps this model at a per-day
    # (rolling) token budget -- once a run exhausts it, each subsequent
    # call waits out Groq's suggested retry time (see _groq_wait), so a
    # single run scoring hundreds of backlog rows can span the full
    # 6-hour hard cap GitHub puts on hosted-runner jobs. Set the job
    # timeout to that cap; re-dispatching (rows are skipped once scored)
    # picks up where an exhausted run leaves off.
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install minimal dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "sqlalchemy[asyncio]>=2.0" asyncpg pydantic-settings openai tenacity

      - name: AI re-score
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_IDS: ${{ secrets.ADMIN_IDS }}
          TELETHON_API_ID: ${{ secrets.TELETHON_API_ID }}
          TELETHON_API_HASH: ${{ secrets.TELETHON_API_HASH }}
          DEST_CHANNEL_ID_SCHOOL: ${{ secrets.DEST_CHANNEL_ID_SCHOOL }}
          DEST_CHANNEL_ID_UNIVERSITY: ${{ secrets.DEST_CHANNEL_ID_UNIVERSITY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          ARGS=""
          if [ "${{ inputs.count_only }}" = "true" ]; then ARGS="$ARGS --count-only"; fi
          if [ "${{ inputs.apply }}" = "true" ]; then ARGS="$ARGS --apply"; fi
          if [ -n "${{ inputs.limit }}" ]; then ARGS="$ARGS --limit ${{ inputs.limit }}"; fi
          python -m scripts.ai_rescore_opportunities $ARGS
