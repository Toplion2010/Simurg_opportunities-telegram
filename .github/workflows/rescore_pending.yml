name: Rescore pending opportunities

# Manual only — never scheduled. Pure regex/arithmetic rescore against the
# current 6-axis rubric (src/core/scoring.py) -- no external calls, so a
# full backlog rescore finishes in seconds regardless of size.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Write the new scores to the database (unchecked = dry run, just prints)."
        required: false
        default: false
        type: boolean
      limit:
        description: "Only rescore this many pending rows (blank = all)."
        required: false
        default: ""
      count_only:
        description: "Just print how many pending rows there are, no scoring (overrides apply/limit)."
        required: false
        default: false
        type: boolean

jobs:
  rescore-pending:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install minimal dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "sqlalchemy[asyncio]>=2.0" asyncpg pydantic-settings

      - name: Rescore pending opportunities
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_IDS: ${{ secrets.ADMIN_IDS }}
          TELETHON_API_ID: ${{ secrets.TELETHON_API_ID }}
          TELETHON_API_HASH: ${{ secrets.TELETHON_API_HASH }}
          DEST_CHANNEL_ID_SCHOOL: ${{ secrets.DEST_CHANNEL_ID_SCHOOL }}
          DEST_CHANNEL_ID_UNIVERSITY: ${{ secrets.DEST_CHANNEL_ID_UNIVERSITY }}
        run: |
          ARGS=""
          if [ "${{ inputs.count_only }}" = "true" ]; then ARGS="$ARGS --count-only"; fi
          if [ "${{ inputs.apply }}" = "true" ]; then ARGS="$ARGS --apply"; fi
          if [ -n "${{ inputs.limit }}" ]; then ARGS="$ARGS --limit ${{ inputs.limit }}"; fi
          python -m scripts.rescore_pending_opportunities $ARGS
